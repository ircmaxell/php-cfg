name: Main
on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: "ubuntu-latest"
    name: "PHP ${{ matrix.php-version }} Unit Tests"
    strategy:
      matrix:
        php-version:
          - "8.1"
          - "8.2"
          - "8.3"
          - "8.4"
          - "8.5"
    steps:
      - name: "Checkout"
        uses: "actions/checkout@v2"
      - name: "Install PHP"
        uses: "shivammathur/setup-php@v2"
        with:
          coverage: "none"
          php-version: "${{ matrix.php-version }}"
          tools: composer:v2
      - name: "Install dependencies"
        run: "composer install --no-interaction"
      - name: "PHPCSFixer installation"
        run: "composer install --no-interaction --working-dir=tools/php-cs-fixer"
      - name: "PHPCSFixer check"
        run: "php tools/php-cs-fixer/vendor/bin/php-cs-fixer check"
      - name: "PHPUnit"
        run: "php vendor/bin/phpunit"
